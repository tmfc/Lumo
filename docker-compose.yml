version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "uv run gunicorn application.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
